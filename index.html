<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>防衛砲台（仮）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hudLives"></div>
      <div id="hudScore">0</div>
      <div id="hudPowerups"></div>
    </div>
    <div class="hud-right">
      <span id="hudTime">0:00</span>
      <button id="pauseBtn" class="icon-btn" aria-label="ポーズ">⏸</button>
    </div>
  </div>

  <div id="hint" class="hidden"></div>

  <div id="touchControls" class="hidden">
    <button id="turnLeftBtn" class="turn-btn" aria-label="左に旋回">◀</button>
    <button id="turnRightBtn" class="turn-btn" aria-label="右に旋回">▶</button>
  </div>

  <div id="titleScreen" class="overlay hidden">
    <h1 class="logo" id="titleLogo"></h1>
    <p class="tagline">旋回して、見つけて、撃ち落とせ。</p>
    <p id="titleProgress" class="title-progress"></p>
    <div class="btn-col">
      <button class="btn" id="startSoloBtn">遊ぶ</button>
      <button class="btn btn-sub hidden" id="startDuoBtn">ふたりで（PC）</button>
      <button class="btn btn-sub" id="titleHowtoBtn">遊び方</button>
      <button class="btn btn-sub" id="titleDiaryBtn">日記</button>
      <button class="btn btn-sub" id="titleSkinBtn">見た目</button>
      <button class="link-btn" id="titleSettingsBtn">設定</button>
    </div>
  </div>

  <div id="howtoScreen" class="overlay hidden">
    <h2 id="howtoTitle"></h2>
    <p id="howtoBody" class="howto-body"></p>
    <p id="howtoPage" class="howto-page"></p>
    <div class="btn-col">
      <div class="howto-nav-row">
        <button class="link-btn" id="howtoPrevBtn">◀ もどる</button>
        <button class="btn" id="howtoNextBtn">つづき ▶</button>
      </div>
    </div>
  </div>

  <div id="stageSelectScreen" class="overlay hidden">
    <h2>ステージ選択</h2>
    <div id="stageGrid"></div>
    <div class="endless-row">
      <button type="button" class="btn btn-sub endless-btn" id="endlessBtn"></button>
      <button type="button" class="btn btn-sub endless-btn" id="hardEndlessBtn"></button>
    </div>
    <button class="link-btn" id="stageBackBtn">タイトルへ</button>
  </div>

  <div id="powerupScreen" class="overlay hidden">
    <h2>パワーアップを選んでね</h2>
    <div class="offer-row">
      <button type="button" class="offer-card" id="offerCard0">
        <span class="card-key">1</span>
        <span class="card-icon"></span>
        <span class="card-name"></span>
        <span class="card-desc"></span>
        <span class="card-level"></span>
      </button>
      <button type="button" class="offer-card" id="offerCard1">
        <span class="card-key">2</span>
        <span class="card-icon"></span>
        <span class="card-name"></span>
        <span class="card-desc"></span>
        <span class="card-level"></span>
      </button>
    </div>
    <p class="offer-hint">クリック・タップ、または 1 / 2 キーで選べます</p>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <h2>ポーズ</h2>
    <div class="btn-col">
      <button class="btn" id="resumeBtn">つづける</button>
      <button class="btn btn-sub" id="pauseSettingsBtn">設定</button>
      <button class="link-btn" id="pauseTitleBtn">タイトルへ</button>
    </div>
  </div>

  <div id="endlessQuitScreen" class="overlay hidden">
    <h2>エンドレスをやめますか？</h2>
    <p class="endless-quit-stats">スコア <span id="endlessQuitScore">0</span>　生存時間 <span id="endlessQuitTime">0:00</span></p>
    <div class="btn-col">
      <button class="btn" id="endlessQuitResumeBtn">つづける</button>
      <button class="btn btn-sub" id="endlessQuitTitleBtn">記録してタイトルへ</button>
      <button class="link-btn danger-link" id="endlessQuitDiscardBtn">記録せずにタイトルへ</button>
    </div>
  </div>

  <div id="resultScreen" class="overlay hidden">
    <h2 id="resultTitle"></h2>
    <dl class="result-stats">
      <dt>スコア</dt><dd id="resultScore">0</dd>
      <dt>撃破数</dt><dd id="resultKills">0</dd>
      <dt id="resultTimeLabel" class="hidden">生存時間</dt><dd id="resultTime" class="hidden">0:00</dd>
      <dt>最高スコア</dt><dd id="resultBest">0</dd>
    </dl>
    <p id="resultNewBest" class="new-best hidden">最高スコア更新！</p>
    <p id="resultDiaryNote" class="new-best hidden">日記が解放されました（タイトルの「日記」から読めます）</p>
    <div class="btn-col">
      <button class="btn" id="nextStageBtn">次のステージへ</button>
      <button class="btn btn-sub" id="retryBtn">もう一度</button>
      <button class="link-btn" id="resultStageSelectBtn">ステージ選択へ</button>
    </div>
  </div>

  <div id="diaryScreen" class="overlay hidden diary-overlay">
    <div class="diary-topbar">
      <button class="link-btn diary-back" id="diaryBackBtn">◀ もどる</button>
      <span id="diaryPageCount" class="diary-pagecount">--/07</span>
    </div>
    <div class="diary-book">
      <div class="diary-page diary-page-left">
        <div class="diary-ink diary-ink-tl"></div>
        <h3 class="diary-toc-heading">目次</h3>
        <div id="diaryList" class="diary-list"></div>
      </div>
      <div class="diary-spine"><span class="diary-ribbon"></span></div>
      <div class="diary-page diary-page-right">
        <div class="diary-ink diary-ink-br"></div>
        <p id="diaryText" class="diary-text">読みたい日記を選んでください</p>
      </div>
    </div>
  </div>

  <div id="skinScreen" class="overlay hidden">
    <h2>見た目を選ぶ</h2>
    <div id="skinList" class="skin-list"></div>
    <canvas id="skinPreviewCanvas" width="160" height="170" class="skin-preview-canvas"></canvas>
    <p id="skinPreviewName" class="skin-preview-name"></p>
    <p id="skinPreviewDesc" class="skin-preview-desc"></p>
    <div class="btn-col">
      <button class="btn" id="skinSelectBtn">これにする</button>
      <div class="skin-code-row">
        <input type="text" id="skinCodeInput" class="skin-code-input" placeholder="コードを入力" autocomplete="off" maxlength="40">
        <button type="button" class="btn btn-sub" id="skinCodeRedeemBtn">解放</button>
      </div>
      <p id="skinCodeStatus" class="skin-code-status"></p>
      <button class="link-btn" id="skinBackBtn">もどる</button>
    </div>
  </div>

  <div id="settingsScreen" class="overlay hidden">
    <h2>設定</h2>
    <label class="slider-row">BGM <input type="range" id="bgmVol" min="0" max="100"></label>
    <label class="slider-row">効果音 <input type="range" id="seVol" min="0" max="100"></label>
    <button class="btn btn-sub" id="muteBtn"></button>
    <button class="link-btn" id="settingsBackBtn">もどる</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
